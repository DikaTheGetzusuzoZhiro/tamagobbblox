<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMA Store — Admin</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/api/config"></script>
</head>
<body class="admin-page">
  <div id="toast" class="toast" aria-live="polite"></div>
  <header class="topbar">
    <div class="brand"><span>TAMA ADMIN</span></div>
    <div class="top-actions"><a class="text-btn" href="/">Store</a><button id="themeBtn" class="icon-btn">◐</button><button id="logoutBtn" class="text-btn hidden">Logout</button></div>
  </header>

  <main class="container admin-main">
    <section id="loginView" class="admin-login">
      <div class="auth-card">
        <p class="eyebrow">ADMIN PANEL</p>
        <h1>Login admin</h1>
        <p class="muted">Gunakan akun Supabase Auth yang sudah kamu buat.</p>
        <input id="adminEmail" class="field" type="email" placeholder="Email">
        <input id="adminPassword" class="field" type="password" placeholder="Password">
        <button id="adminLogin" class="pink-btn full">Masuk</button>
      </div>
    </section>

    <section id="adminView" class="hidden">
      <div class="admin-head">
        <div>
          <p class="eyebrow">DASHBOARD</p>
          <h1>Kelola katalog & live chat</h1>
        </div>
        <input id="adminSearch" class="field admin-search" placeholder="Ketik cari produk...">
      </div>

      <div class="admin-grid">
        <section class="panel">
          <div class="panel-head"><h2 id="formTitle">Tambah produk</h2></div>
          <form id="productForm">
            <input id="productId" type="hidden">
            <label>Judul<input id="productTitle" class="field" required maxlength="100"></label>
            <label>Deskripsi<textarea id="productDescription" class="field area" required maxlength="2000" rows="6"></textarea></label>
            <label>Nominal harga (contoh 50.000)<input id="productPrice" class="field" type="number" min="20000" max="1000000" step="1000" required></label>
            <label>Thumbnail 1 foto<input id="thumbnailFile" class="field" type="file" accept="image/*"></label>
            <label>Foto spek tambahan (boleh beberapa)<input id="galleryFiles" class="field" type="file" accept="image/*" multiple></label>
            <div class="form-actions"><button class="pink-btn" type="submit">Simpan produk</button><button id="cancelEdit" class="text-btn hidden" type="button">Batal edit</button></div>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>Produk</h2><span id="productCount" class="count"></span></div>
          <div id="adminProducts" class="admin-products"></div>
        </section>
      </div>

      <section class="panel chat-admin-panel">
        <div class="panel-head"><div><h2>Live chat</h2><p class="muted small-text">Balas user, pilih kategori, dan akhiri chat.</p></div><button id="refreshChats" class="text-btn">Refresh</button></div>
        <div class="chat-admin-grid">
          <div id="chatList" class="chat-list"></div>
          <div class="chat-admin-window">
            <div id="adminChatEmpty" class="empty">Pilih chat di sebelah kiri.</div>
            <div id="adminChatActive" class="hidden">
              <div class="admin-chat-title"><div><strong id="adminChatUser"></strong><span id="adminChatCategory" class="badge"></span></div><button id="adminEndChat" class="end-btn">Akhiri</button></div>
              <div id="adminChatMessages" class="chat-messages"></div>
              <div class="chat-compose"><input id="adminChatInput" class="field" maxlength="500" placeholder="Balas pesan..."><button id="adminSendChat" class="pink-btn">Kirim</button></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Ulasan</h2><button id="refreshReviews" class="text-btn">Refresh</button></div>
        <div id="adminReviews" class="admin-reviews"></div>
      </section>
    </section>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
